name: app_teme
description: "Aplicativo Bíblia TEME - Trabalho Evangélico Missão Eterna em Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Pacotes necessários para áudio, compartilhamento, fontes e persistência off-line
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.2
  share_plus: ^13.1.0
  google_fonts: ^8.1.0
  provider: ^6.1.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/json/